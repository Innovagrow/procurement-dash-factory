# ============================================================================
# ΜΗΤΡΩΟ ΥΛΟΠΟΙΗΜΕΝΩΝ ΜΗΧΑΝΙΣΜΩΝ
# ============================================================================
# Ό,τι πραγματικά τρέχει στο σύστημα. Κάθε εγγραφή δείχνει σε αρχείο και
# συνάρτηση που υπάρχουν — το `python -m akinita.registry audit` το ελέγχει
# και σπάει αν κάτι δεν στέκει.
#
# Κανόνας: μηχανισμός χωρίς `validation` είναι υπόθεση, όχι μηχανισμός.
#
# status: active | experimental | deprecated
# ============================================================================

mechanisms:

  # ------------------------------------------------- βαθμολόγηση ευκαιρίας
  - id: MECH-001
    title: Συγκριτικά γειτονιάς → απόκλιση τιμής (ΔΙΑΛΟΓΗ ΜΟΝΟ)
    implements: SIG-015
    module: akinita/scoring.py
    entrypoint: MarketIndex.sale_price_per_sqm
    produces: [market_price_per_sqm, discount_pct]
    feeds_score: value_gap
    weight: 0.20
    validation: >-
      Έλεγχος ότι η γειτονιά υπερισχύει του γεωγραφικού κελιού όταν και τα δύο
      υπάρχουν, και ότι οι υποψήφιοι εξαιρούνται από τη δική τους βάση σύγκρισης.
    known_limits: >-
      ΖΗΤΟΥΜΕΝΕΣ τιμές, όχι συναλλαγές — δηλαδή γνώμες πωλητών, που μπορεί να
      είναι και ψευδείς. Υποβιβάστηκε από 0,35 σε 0,20 και ΔΕΝ κατατάσσει πλέον
      τίποτα: τροφοδοτεί μόνο τη διαλογή για το ποια ακίνητα αξίζουν πλήρη
      ανάλυση. Η ετυμηγορία βγαίνει από το MECH-013 (απόδοση υπό πίεση).
    status: active
    since: 2026-08-22

  - id: MECH-002
    title: Συγκριτικά ενοικίων → μεικτή απόδοση
    implements: SIG-015
    module: akinita/scoring.py
    entrypoint: MarketIndex.rent_price_per_sqm
    produces: [est_monthly_rent, gross_yield_pct]
    feeds_score: rental_yield
    weight: 0.30
    validation: Έλεγχος υπολογισμού απόδοσης και ορίου αληθοφάνειας στο 14%.
    known_limits: >-
      Ζητούμενα ενοίκια. Δεν γνωρίζει κενά, καθυστερήσεις ή τοπικούς
      περιορισμούς βραχυχρόνιας μίσθωσης (βλ. SIG-011).
    status: active
    since: 2026-08-22

  - id: MECH-003
    title: Ρευστότητα από εγγύτητα σε αστικό κέντρο
    implements: SIG-003
    module: akinita/scoring.py
    entrypoint: _score_liquidity
    produces: [liquidity_score]
    feeds_score: liquidity
    weight: 0.15
    validation: Έλεγχος αντιστοίχισης συντεταγμένων στο πλησιέστερο αστικό κέντρο.
    known_limits: >-
      Υποκατάστατο. Η απόσταση από την Αθήνα δεν είναι δημογραφική τάση· το
      SIG-003 θα το αντικαταστήσει με πραγματικά στοιχεία πληθυσμού.
    status: active
    since: 2026-08-22

  - id: MECH-004
    title: Καταλληλότητα εισιτηρίου έναντι προϋπολογισμού
    implements: SIG-015
    module: akinita/scoring.py
    entrypoint: _score_ticket_fit
    produces: [ticket_fit]
    feeds_score: ticket_fit
    weight: 0.15
    validation: Έλεγχος ότι τιμές κάτω των 5.000 € σημαίνονται ως πιθανά ποσοστά.
    known_limits: Το «γλυκό σημείο» 35–85% του ορίου είναι κρίση, όχι μέτρηση.
    status: active
    since: 2026-08-22

  - id: MECH-005
    title: Κατάσταση & περιθώριο υπεραξίας από κείμενο αγγελίας
    implements: SIG-018
    module: akinita/scoring.py
    entrypoint: _score_upside
    produces: [upside]
    feeds_score: upside
    weight: 0.15
    validation: Έλεγχος ότι «χρήζει ανακαίνισης» ανεβάζει και «ανακαινισμένο» κατεβάζει.
    known_limits: >-
      Λέξεις-κλειδιά σε ελεύθερο κείμενο. Ο πιο βαρύς συντελεστής της αποτίμησης
      στηρίζεται στην πιο αδύναμη ένδειξη. Το SIG-018 (φωτογραφίες) το στοχεύει.
    status: active
    since: 2026-08-22

  - id: MECH-006
    title: Χρόνος στην αγορά
    implements: SIG-008
    module: akinita/scoring.py
    entrypoint: _score_freshness
    produces: [freshness]
    feeds_score: freshness
    weight: 0.05
    validation: Έλεγχος ότι νέες αγγελίες και πολύ παλιές βαθμολογούνται και οι δύο ψηλά.
    known_limits: >-
      Μερική υλοποίηση του SIG-008: βλέπει την ηλικία που δηλώνει η πύλη, όχι
      τον πραγματικό χρόνο μέχρι την πώληση. Θέλει ιστορικό σαρώσεων.
    status: active
    since: 2026-08-22

  # ----------------------------------------------------- δικλείδες ποιότητας
  - id: MECH-007
    title: Οροφές αληθοφάνειας σε έκπτωση και απόδοση
    implements: SIG-015
    module: akinita/scoring.py
    entrypoint: score_listing
    produces: [flags]
    feeds_score: "—"
    weight: 0.0
    validation: Έλεγχος ότι έκπτωση >55% και απόδοση >14% σημαίνονται και δεν κερδίζουν βαθμούς.
    known_limits: Τα κατώφλια είναι κρίση αγοράς, όχι στατιστική εκτίμηση.
    status: active
    since: 2026-08-22

  - id: MECH-008
    title: Διάμεσος με περικοπή άκρων
    implements: SIG-015
    module: akinita/scoring.py
    entrypoint: _median
    produces: [market_price_per_sqm]
    feeds_score: "—"
    weight: 0.0
    validation: Έλεγχος ότι ένα ακραίο συγκριτικό δεν μετακινεί τη βάση.
    known_limits: Ενεργοποιείται μόνο με ≥8 συγκριτικά.
    status: active
    since: 2026-08-22

  - id: MECH-009
    title: Κούρεμα εκτίμησης ενοικίου κατά θέση τιμής
    implements: SIG-015
    module: akinita/scoring.py
    entrypoint: _quality_haircut
    produces: [est_monthly_rent]
    feeds_score: rental_yield
    weight: 0.0
    validation: Έλεγχος ότι ακίνητο στο 1/5 της τιμής γειτονιάς παίρνει το 60% του ενοικίου.
    known_limits: >-
      Ο συντελεστής 0,5 + 0,5 × θέση είναι εύλογη παραδοχή, όχι μετρημένη σχέση.
      Πρώτος υποψήφιος για βαθμονόμηση από πραγματικά μισθωτήρια.
    status: active
    since: 2026-08-22

  # --------------------------------------------------------------- αποτίμηση
  - id: MECH-010
    title: Ηδονική αποτίμηση με αναλυμένους συντελεστές
    implements: SIG-015
    module: akinita/valuation.py
    entrypoint: value_property
    produces: [open_market, immediate, low, high, confidence_pct, factor_table]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      Έλεγχος ότι κάθε συντελεστής εμφανίζεται με τιμή, αιτιολογία και ένδειξη
      «δεδομένο ή παραδοχή», και ότι το εύρος εμπιστοσύνης πλαταίνει με τις παραδοχές.
    known_limits: >-
      Το κούρεμα 7% από ζητούμενη σε συναλλαγή είναι παραδοχή. Οι πίνακες
      συντελεστών (κατάσταση, όροφος, παλαιότητα) είναι κρίση αγοράς.
    status: active
    since: 2026-08-22

  - id: MECH-011
    title: Άμεση, ανοιχτής αγοράς και μελλοντική αξία
    implements: SIG-014
    module: akinita/valuation.py
    entrypoint: value_at_horizon
    produces: [immediate, open_market, horizon_value]
    feeds_score: "—"
    weight: 0.0
    validation: Έλεγχος ότι η έκπτωση ταχείας ρευστοποίησης βαθαίνει σε αγορές χαμηλής ρευστότητας.
    known_limits: >-
      Το `annual_drift_pct` δίνεται χειροκίνητα. Είναι η μεγαλύτερη μονή
      παραδοχή του συστήματος — βλ. SIG-014.
    status: active
    since: 2026-08-22

  - id: MECH-012
    title: Μοντέλο κόστους ελληνικής συναλλαγής
    implements: SIG-012
    module: akinita/costs.py
    entrypoint: CostModel
    produces: [acquisition_costs, disposal_costs, holding_costs, works_cost, tax_on_rent]
    feeds_score: "—"
    weight: 0.0
    validation: Έλεγχος κλιμακωτού φόρου ενοικίου και υπολογισμού κόστους κτήσης.
    known_limits: >-
      Ο ΕΝΦΙΑ είναι σταθερά ανά τ.μ., όχι ανά ζώνη (SIG-012). Ο φόρος υπεραξίας
      και ο ΦΠΑ νεόδμητων είναι σε αναστολή και δίνονται μηδενικοί — ελέγξτε ετησίως.
    status: active
    since: 2026-08-22

  # ------------------------------------------------------------- στρατηγικές
  - id: MECH-013
    title: Πίνακας πλάνων — απόκτηση × μετασχηματισμός × έξοδος
    implements: SIG-015
    module: akinita/strategies.py
    entrypoint: generate_plans
    produces: [plans]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      32 πλάνα για κτίσμα, 10 για γη. Έλεγχος ότι καλύπτονται αγορά οικοπέδου →
      ανέγερση → πώληση/μίσθωση/επαγγελματική χρήση/λειτουργία, και ανακαίνιση →
      πώληση/μίσθωση, χωρίς χειρόγραφη συνάρτηση ανά περίπτωση.
    known_limits: >-
      Οι βαθμοί `ease` και `risk` είναι κρίση, όχι μέτρηση. Η βραχυχρόνια
      μίσθωση αγνοεί τοπικές απαγορεύσεις (SIG-011).
    status: active
    since: 2026-08-22

  - id: MECH-016
    title: Έξι ξεχωριστοί δείκτες σε απόλυτη κλίμακα
    implements: SIG-021
    module: akinita/indicators.py
    entrypoint: Indicators
    produces: [return, certainty, speed, capital, ease, risk, combined]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      Έλεγχος ότι κάθε δείκτης χαρτογραφεί απόλυτο μέγεθος σε 0–100, ώστε
      αριθμοί από διαφορετικά ακίνητα να συγκρίνονται, και ότι ο συνδυαστικός
      είναι σταθμισμένο άθροισμα των έξι.
    known_limits: >-
      Τα σημεία καμπής των καμπυλών (τι σημαίνει «καλή απόδοση», «λίγο
      κεφάλαιο») είναι κρίση αγοράς και θέλουν βαθμονόμηση με δικά μας deals.
    status: active
    since: 2026-08-22

  - id: MECH-017
    title: Δοκιμή αντοχής — απόδοση αν τα δεδομένα της πύλης είναι ψέμα
    implements: SIG-021
    module: akinita/strategies.py
    entrypoint: price_plan
    produces: [annualised_roi_stressed_pct, net_profit_stressed, certainty]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      Κάθε πλάνο ξανα-τιμολογείται με συγκριτικά πώλησης −20% και ενοίκια −15%.
      Έλεγχος ότι η μεταπώληση χάνει σχεδόν όλο το κέρδος της (62% → 10%) ενώ η
      δεκαετής μίσθωση κρατά το μεγαλύτερο μέρος (7,6% → 4,9%), και ότι ο
      δείκτης βεβαιότητας το αποτυπώνει (28 έναντι 47).
    known_limits: >-
      Τα ποσοστά πίεσης (20%/15%) είναι κρίση. Θα έπρεπε να προκύπτουν από
      μετρημένη απόκλιση ζητούμενης–τελικής τιμής (SIG-015).
    status: active
    since: 2026-08-22

  - id: MECH-018
    title: Κατάταξη σε απόδοση υπό πίεση, όχι σε έκπτωση
    implements: SIG-021
    module: akinita/indicators.py
    entrypoint: score_return
    produces: [return]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      Έλεγχος ότι ο δείκτης απόδοσης σταθμίζει 65% την υπό πίεση απόδοση και 35%
      την ονομαστική, ώστε πλάνο που καταρρέει υπό πίεση να μην κατατάσσεται
      πρώτο μόνο και μόνο επειδή η ονομαστική του είναι μεγάλη.
    known_limits: Το 65% είναι επιλογή πολιτικής, ρυθμιζόμενη.
    status: active
    since: 2026-08-22

  - id: MECH-019
    title: Διαχωρισμός αγοράς γης από αγορά δομημένου χώρου
    implements: SIG-013
    module: akinita/strategies.py
    entrypoint: MarketInputs
    produces: [built_price_per_sqm, rent_per_sqm_month]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      Έλεγχος ότι η ανέγερση αποτιμάται με τιμές δομημένου χώρου και όχι με το
      €/τ.μ. του οικοπέδου. Πριν τον διαχωρισμό, κάθε πλάνο ανέγερσης έβγαζε
      −70% απόδοση — σφάλμα που έμοιαζε με συμπέρασμα.
    known_limits: >-
      Χωρίς τιμή δομημένου χώρου τα πλάνα ανέγερσης δηλώνονται μη εφικτά αντί
      να μαντεύονται.
    status: active
    since: 2026-08-22

  - id: MECH-014
    title: Κάθε επίπεδο εργασιών ως ξεχωριστό πλάνο
    implements: SIG-015
    module: akinita/strategies.py
    entrypoint: price_plan
    produces: [works_level, works_cost]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      Έλεγχος ότι η πλήρης ανακαίνιση δεν προτείνεται όταν το «χωρίς εργασίες»
      αποδίδει περισσότερο — στο ίδιο διαμέρισμα 40.000 €, η μίσθωση χωρίς έργα
      βγαίνει 15,0% ενώ με πλήρη ανακαίνιση 3,2%, και κατατάσσεται αναλόγως.
      Είναι ο ΜΟΝΟΣ φραγμός υπερ-ανακαίνισης: η παλαιότερη «οροφή γειτονιάς»
      στο valuation.py αφαιρέθηκε όταν test έδειξε ότι δεν ενεργοποιούνταν ποτέ.
    known_limits: >-
      Τα κόστη ανά τ.μ. είναι πανελλαδικοί μέσοι όροι· διαφέρουν ανά περιοχή.
      Ο εσωτερικός βελτιστοποιητής `_best_works_level` καταργήθηκε: κάθε επίπεδο
      είναι πλέον δικό του πλάνο στον πίνακα και η κατάταξη κάνει την επιλογή,
      ώστε να φαίνονται και οι απορριφθείσες εναλλακτικές.
    status: active
    since: 2026-08-22

  - id: MECH-015
    title: Συνδυαστική κατάταξη και νικητής ανά δείκτη
    implements: SIG-021
    module: akinita/strategies.py
    entrypoint: best_per_indicator
    produces: [combined, best_per_indicator, best_per_category]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      Έλεγχος ότι η αλλαγή βαρών αλλάζει την κατάταξη προς την αναμενόμενη
      κατεύθυνση και ότι κάθε δείκτης δίνει και δικό του νικητή, ξεχωριστά.
    known_limits: Τα προεπιλεγμένα βάρη είναι επιλογή πολιτικής, όχι μέτρηση.
    status: active
    since: 2026-08-22

  # ---------------------------------------------------------------- σήματα
  - id: MECH-101
    title: Τουριστικές διανυκτερεύσεις ανά περιφέρεια
    implements: SIG-001
    module: akinita/signals/tourism.py
    entrypoint: TourismSignal.reading
    produces: [tourism_intensity, tourism_momentum]
    feeds_score: "στρατηγικές (RENT_SHORT, OPERATE_BUSINESS)"
    weight: 0.0
    validation: >-
      Έλεγχος σε ζωντανά δεδομένα: κατάταξη 13 περιφερειών, με Νότιο Αιγαίο και
      Κρήτη στην κορυφή και Δυτική Μακεδονία στον πάτο. Τα έτη COVID εξαιρούνται
      από τον ρυθμό μεταβολής.
    known_limits: >-
      NUTS 2 — πολύ χονδρικό. Η Μύκονος και η Σύρος μοιράζονται δείκτη.
      Καθυστέρηση δημοσίευσης ~6 μήνες. Η ένταση είναι κατάταξη μεταξύ των 13
      περιφερειών, όχι απόλυτο μέγεθος: η τελευταία περιφέρεια γράφει 0/100 ενώ
      έχει 342.558 διανυκτερεύσεις. Όταν το σήμα δεν μετρηθεί καθόλου, το
      MarketInputs.tourism_intensity μένει None και τα σχέδια που το χρειάζονται
      μπλοκάρονται ως «άγνωστη ζήτηση» — ποτέ ως μετρημένο μηδέν.
    status: active
    since: 2026-08-22

  - id: MECH-102
    title: Ένταση δημόσιων έργων ανά δήμο
    implements: SIG-004
    module: akinita/signals/public_investment.py
    entrypoint: PublicInvestmentSignal.reading
    produces: [public_investment_intensity]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      Έλεγχος αντιστοίχισης ονομάτων σε 12 πόλεις: 8 σωστές, 0 λανθασμένες,
      4 χωρίς αντιστοίχιση. Οι διφορούμενες (Ηράκλειο/Ηράκλεια) απορρίπτονται.
    known_limits: >-
      Δείγμα λέξεων-κλειδιών, όχι απογραφή. Μετράει πλήθος αποφάσεων, όχι ευρώ.
      Δεν τροφοδοτεί ακόμη τη βαθμολογία — μόνο πληροφόρηση.
    status: experimental
    since: 2026-08-22

  - id: MECH-103
    title: Ειδήσεις ανάπτυξης ανά περιοχή
    implements: SIG-007
    module: akinita/signals/news.py
    entrypoint: NewsSignal.reading
    produces: [news_intensity, headlines]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      Έλεγχος ορίων λέξης: «Τραμπ» δεν ενεργοποιεί το «τραμ». Συσσώρευση σε
      τοπικό αρχείο ώστε η κάλυψη να χτίζεται με τον χρόνο.
    known_limits: >-
      Μία ροή, ~30 άρθρα ανά εκτέλεση. Άχρηστο πριν από εβδομάδες συσσώρευσης.
      Λίστα παρακολούθησης, όχι δείκτης.
    status: experimental
    since: 2026-08-22

  # ---------------------------------------------------- εντοπισμός & επαφές
  - id: MECH-201
    title: Κατάλογος επαγγελματιών ακινήτων
    implements: SIG-010
    module: akinita/brokers.py
    entrypoint: main
    produces: [broker_directory]
    feeds_score: "—"
    weight: 0.0
    validation: 5.070 προφίλ· σε δείγμα 14 προφίλ, 14/14 με έγκυρο email.
    known_limits: >-
      Τηλέφωνα δεν αντλούνται — το τηλέφωνο στη σελίδα προφίλ ανήκει στην πύλη,
      όχι στον μεσίτη.
    status: active
    since: 2026-08-22

  - id: MECH-206
    title: Φραγή πηγών των οποίων οι Όροι Χρήσης επιφυλάσσουν το περιεχόμενο
    implements: SIG-023
    module: akinita/sources/base.py
    entrypoint: PropertySource
    produces: [consent_gate]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      Το Spitogatos σημαίνεται `requires_consent` και ο screener επιστρέφει
      κωδικό 3 με εξήγηση αντί να τρέξει. Έλεγχος ότι η εξήγηση παραθέτει τη
      ρήτρα, δίνει τον σύνδεσμο των Όρων και προτείνει τη νόμιμη διαδρομή.
    known_limits: >-
      Η σημαία δηλώνεται χειροκίνητα ανά πηγή μετά από ανάγνωση των Όρων — δεν
      εξάγεται αυτόματα. Κάθε νέα πηγή απαιτεί να διαβαστούν οι Όροι της.
    status: active
    since: 2026-08-22

  - id: MECH-203
    title: Πηγή δεδομένων από αρχείο (CSV/TSV)
    implements: SIG-022
    module: akinita/sources/csvfile.py
    entrypoint: CsvSource
    produces: [listings, rent_listings]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      Ελληνικές και αγγλικές κεφαλίδες, διαχωριστικά «,», «;» και tab, ελληνικός
      χωρισμός χιλιάδων, και οι τέσσερις τύποι ακινήτων. Ο έλεγχος τύπου γίνεται
      σε όρια λέξης: το «warehouse» περιέχει «house» και καταχωρούνταν ως κατοικία.
      Οι πίνακες συνωνύμων κανονικοποιούνται όπως και οι κεφαλίδες — αλλιώς το
      τελικό σίγμα («Κωδικός» → «κωδικοσ») εμπόδιζε κάθε αντιστοίχιση.
    known_limits: >-
