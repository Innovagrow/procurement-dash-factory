databases:
  - name: upbid-postgres
    databaseName: upbid
    user: upbid
    plan: basic-256mb

services:
  - type: keyvalue
    name: upbid-redis
    plan: free
    ipAllowList: []

  - type: web
    name: upbid-api
    runtime: docker
    dockerfilePath: ./upwork-autobid/Dockerfile
    dockerContext: ./upwork-autobid
    plan: starter
    healthCheckPath: /api/health/live
    dockerCommand: node dist/server/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: upbid-postgres, property: connectionString}
      - key: REDIS_URL
        fromService: {name: upbid-redis, type: keyvalue, property: connectionString}
      - key: API_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

  - type: worker
    name: upbid-worker
    runtime: docker
    dockerfilePath: ./upwork-autobid/Dockerfile
    dockerContext: ./upwork-autobid
    plan: starter
    dockerCommand: node dist/workers/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: upbid-postgres, property: connectionString}
      - key: REDIS_URL
        fromService: {name: upbid-redis, type: keyvalue, property: connectionString}
      - key: ANTHROPIC_API_KEY
        sync: false
