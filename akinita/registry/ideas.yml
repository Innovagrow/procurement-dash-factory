# ============================================================================
# ΜΗΤΡΩΟ ΙΔΕΩΝ — σήματα που ίσως προβλέπουν αξία
# ============================================================================
# Εδώ μπαίνει κάθε ιδέα για σήμα, πριν γραφτεί μία γραμμή κώδικα. Μια ιδέα
# ζει εδώ όσο είναι ιδέα. Όταν υλοποιηθεί, αποκτά αντίστοιχη εγγραφή στο
# mechanisms.yml και το `status` γίνεται `implemented`.
#
# Γράψτε ελεύθερα. Η μόνη υποχρέωση είναι η `hypothesis`: τι πιστεύουμε και
# γιατί αυτό προβλέπει αξία. Ιδέα χωρίς υπόθεση δεν ελέγχεται ποτέ.
#
# status:      idea | research | prototype | implemented | rejected
# feasibility: proven | probable | hard | blocked
# horizon:     immediate | 1-2y | 3-5y
# ============================================================================

ideas:

  # ---------------------------------------------------------------- ζήτηση
  - id: SIG-001
    title: Τουριστικές ροές ανά περιφέρεια
    hypothesis: >-
      Οι διανυκτερεύσεις ανά περιφέρεια δείχνουν πού υπάρχει πραγματική ζήτηση
      βραχυχρόνιας μίσθωσης. Η ένταση είναι ήδη τιμολογημένη· ο ΡΥΘΜΟΣ ΜΕΤΑΒΟΛΗΣ
      δεν είναι. Μια δευτερεύουσα περιοχή που μεγαλώνει 3% τον χρόνο επί πενταετία
      αλλάζει κατηγορία χωρίς να το προσέξει η αγορά.
    category: ζήτηση
    horizon: 1-2y
    affects: [rental_yield, strategy_rent_short, liquidity]
    source:
      name: Eurostat tour_occ_nin2
      url: https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/tour_occ_nin2
      access: API
      licence: Ανοικτά δεδομένα Eurostat
    feasibility: proven
    effort: μικρή — ένα αίτημα για όλες τις περιφέρειες
    expected_lift: υψηλό
    status: implemented
    implemented_by: MECH-101
    notes: >-
      Τα 2020–2021 πρέπει να εξαιρούνται. Χωρίς αυτό ο ρυθμός βγαίνει +40%/έτος
      για κάθε περιφέρεια και μετράει το άνοιγμα των συνόρων, όχι τον τουρισμό.

  - id: SIG-002
    title: Φοιτητικός πληθυσμός ανά πόλη
    hypothesis: >-
      Ο αριθμός εγγεγραμμένων φοιτητών ανά πόλη, διαιρεμένος με το απόθεμα
      μικρών διαμερισμάτων, δίνει τη σφιχτότητα της φοιτητικής αγοράς. Πόλεις με
      μεγάλα ιδρύματα και μικρό απόθεμα έχουν σταθερή ζήτηση, ανεπηρέαστη από
      τον τουρισμό.
    category: ζήτηση
    horizon: immediate
    affects: [rental_yield, strategy_rent_student]
    source:
      name: ΕΛΣΤΑΤ / Υπουργείο Παιδείας — στοιχεία τριτοβάθμιας
      url: https://www.statistics.gr
      access: manual + scraping
      licence: Δημόσια στατιστικά
    feasibility: probable
    effort: μέτρια — τα στοιχεία δεν έχουν σταθερό API
    expected_lift: μέτριο
    status: idea
    notes: >-
      Προσωρινά το `student_demand` δίνεται χειροκίνητα στο MarketInputs. Η
      απόσταση από campus είναι πιθανότατα καλύτερος δείκτης από τον πληθυσμό.

  - id: SIG-003
    title: Δημογραφική τάση ανά δήμο
    hypothesis: >-
      Ο πληθυσμός φεύγει από τους μισούς δήμους της χώρας. Ακίνητο σε δήμο που
      χάνει 1%/έτος πληθυσμό δεν είναι φθηνό — είναι σωστά τιμολογημένο, και θα
      είναι φθηνότερο του χρόνου.
    category: ζήτηση
    horizon: 3-5y
    affects: [liquidity, value_gap]
    source:
      name: ΕΛΣΤΑΤ — απογραφές 2011 & 2021, ετήσιες εκτιμήσεις
      url: https://www.statistics.gr
      access: manual
      licence: Δημόσια στατιστικά
    feasibility: probable
    effort: μέτρια — εφάπαξ φόρτωση, σπάνια ενημέρωση
    expected_lift: υψηλό
    status: idea
    notes: >-
      Πιθανώς το ισχυρότερο αρνητικό φίλτρο που μας λείπει. Θα έκοβε από μόνο
      του μεγάλο μέρος των «ευκαιριών» της περιφέρειας.

  # ------------------------------------------------------------- υποδομές
  - id: SIG-004
    title: Ένταση δημόσιων έργων ανά δήμο
    hypothesis: >-
      Κάθε δημόσιο έργο αναρτάται στη Διαύγεια πριν εκτελεστεί. Δήμος με
      ασυνήθιστα πολλές αποφάσεις ανάπλασης/υποδομών θα δει τιμές να ανεβαίνουν
      πριν το καταγράψουν οι αγγελίες.
    category: υποδομές
    horizon: 1-2y
    affects: [upside, liquidity, value_at_horizon]
    source:
      name: Διαύγεια — opendata search API
      url: https://diavgeia.gov.gr/opendata/search.json
      access: API
      licence: Ανοικτά δεδομένα δημοσίου
    feasibility: proven
    effort: μέτρια — δειγματοληψία με λέξεις-κλειδιά, χωρίς ποσά
    expected_lift: μέτριο
    status: implemented
    implemented_by: MECH-102
    notes: >-
      Το API δεν φιλτράρει κατά οργανισμό ούτε εκθέτει ποσά. Μετράμε πλήθος
      αποφάσεων, όχι ευρώ. Η αντιστοίχιση ονόματος περιοχής σε δήμο είναι το
      επικίνδυνο σημείο — λάθος αντιστοίχιση χειρότερη από καμία.

  - id: SIG-005
    title: Έργα ΕΣΠΑ και Ταμείου Ανάκαμψης ανά περιοχή
    hypothesis: >-
      Τα ενταγμένα έργα ΕΣΠΑ έχουν ΠΟΣΑ και ΤΟΠΟΘΕΣΙΑ, που η Διαύγεια δεν δίνει.
      Ένα έργο 40 εκατ. σε δήμο 15.000 κατοίκων είναι γεγονός που αλλάζει την αγορά.
    category: υποδομές
    horizon: 1-2y
    affects: [upside, value_at_horizon]
    source:
      name: anaptyxi.gov.gr — ανοικτά δεδομένα ΕΣΠΑ
      url: https://anaptyxi.gov.gr
      access: API / open data
      licence: Ανοικτά δεδομένα δημοσίου
    feasibility: probable
    effort: μέτρια
    expected_lift: υψηλό
    status: research
    notes: Πιθανώς ανώτερο του SIG-004 ακριβώς επειδή φέρει ποσά.

  - id: SIG-006
    title: Απόσταση από μέσα σταθερής τροχιάς
    hypothesis: >-
      Η εγγύτητα σε μετρό/τραμ αποτυπώνεται σε τιμές πολύ πριν τα εγκαίνια. Η
      επέκταση γραμμής είναι από τα λίγα γεγονότα που μετακινούν μια γειτονιά
      κατηγορία μέσα σε πενταετία.
    category: υποδομές
    horizon: 3-5y
    affects: [value_at_horizon, liquidity]
    source:
      name: OpenStreetMap (σταθμοί) + ανακοινώσεις Αττικό Μετρό
      url: https://overpass-api.de
      access: API
      licence: ODbL
    feasibility: probable
    effort: μέτρια — γεωχωρικός υπολογισμός απόστασης
    expected_lift: υψηλό
    status: idea
    notes: Αφορά κυρίως Αττική και Θεσσαλονίκη· αλλού δεν εφαρμόζεται.

  # --------------------------------------------------------- πληροφόρηση
  - id: SIG-007
    title: Ειδήσεις ανάπτυξης ανά περιοχή
    hypothesis: >-
      Ξενοδοχείο που πωλείται, μαρίνα που δημοπρατείται, εργοστάσιο που κλείνει —
      γεγονότα που δεν υπάρχουν σε καμία βάση δεδομένων αλλά μετακινούν τοπικές
      αγορές.
    category: πληροφόρηση
    horizon: immediate
    affects: [upside, watchlist]
    source:
      name: Δημόσιες ροές RSS οικονομικού Τύπου
      url: https://www.naftemporiki.gr/feed/
      access: RSS
      licence: Έλεγχος όρων κάθε εκδότη
    feasibility: proven
    effort: μικρή για τη ροή, μεγάλη για να γίνει αξιόπιστο
    expected_lift: χαμηλό ως σήμα, υψηλό ως λίστα παρακολούθησης
    status: implemented
    implemented_by: MECH-103
    notes: >-
      Μια ροή δίνει ~30 άρθρα. Χρειάζεται συσσώρευση εβδομάδων για να καλύψει
      περιοχές. Η κάλυψη των ΜΜΕ ακολουθεί τη διαφήμιση, όχι την ανάπτυξη —
      χρήση ως watchlist, όχι ως δείκτης.

  - id: SIG-008
    title: Αγγελίες που εξαφανίζονται γρήγορα
    hypothesis: >-
      Ο χρόνος μέχρι να φύγει μια αγγελία από την πύλη είναι ο καθαρότερος
      δείκτης πραγματικής ζήτησης που μπορούμε να μετρήσουμε μόνοι μας. Γειτονιά
      όπου το απόθεμα φεύγει σε 20 μέρες είναι άλλη αγορά από γειτονιά όπου
      κάθεται 300.
    category: ζήτηση
    horizon: immediate
    affects: [liquidity, value_gap, immediate_value]
    source:
      name: Το ίδιο μας το ιστορικό σαρώσεων
      url: ""
      access: εσωτερικό
      licence: δικό μας
    feasibility: probable
    effort: μικρή — χρειάζεται μόνο να κρατάμε κάθε σάρωση
    expected_lift: υψηλό
    status: idea
    notes: >-
      Δεν κοστίζει τίποτα σε εξωτερικά δεδομένα και είναι από τα ισχυρότερα
      σήματα της λίστας. Απαιτεί μόνο πειθαρχία: αποθήκευση κάθε σάρωσης με
      ημερομηνία. Προτεραιότητα.

  - id: SIG-009
    title: Μειώσεις τιμής στην ίδια αγγελία
    hypothesis: >-
      Αγγελία που έχει κατέβει τιμή δύο φορές σε τρεις μήνες έχει πωλητή υπό
      πίεση. Είναι το πιο άμεσα αξιοποιήσιμο σήμα διαπραγμάτευσης που υπάρχει.
    category: προσφορά
    horizon: immediate
    affects: [negotiation, value_gap]
    source:
      name: Το ίδιο μας το ιστορικό σαρώσεων
      url: ""
      access: εσωτερικό
      licence: δικό μας
    feasibility: probable
    effort: μικρή — προϋποθέτει το SIG-008
    expected_lift: υψηλό
    status: idea

  - id: SIG-010
    title: Πυκνότητα αγγελιών ανά ιδιοκτήτη/γραφείο
    hypothesis: >-
      Γραφείο με 40 αγγελίες στην ίδια γειτονιά ξέρει την αγορά και συχνά έχει
      χαρτοφυλάκιο εκτός αγγελιών. Είναι και σήμα ευκαιρίας και λίστα επαφών.
    category: προσφορά
    horizon: immediate
    affects: [sourcing, outreach]
    source:
      name: Πεδία company_title / account_id των αγγελιών
      url: ""
      access: εσωτερικό
      licence: δικό μας
    feasibility: proven
    effort: ελάχιστη — τα δεδομένα ήδη συλλέγονται
    expected_lift: μέτριο
    status: idea
    notes: Συνδέει άμεσα τη μηχανή εντοπισμού με την καμπάνια προς μεσίτες.

  # ------------------------------------------------------------ ρυθμιστικό
  - id: SIG-011
    title: Περιορισμοί βραχυχρόνιας μίσθωσης ανά περιοχή
    hypothesis: >-
      Όπου μπαίνει πλαφόν ή απαγόρευση σε νέες βραχυχρόνιες μισθώσεις, η
      στρατηγική RENT_SHORT δεν είναι απλώς χειρότερη — είναι παράνομη. Και
      αντίστροφα, οι υπάρχουσες άδειες αποκτούν αξία σπανιότητας.
    category: ρυθμιστικό
    horizon: immediate
    affects: [strategy_rent_short, feasibility]
    source:
      name: ΦΕΚ / ΑΑΔΕ Μητρώο Βραχυχρόνιας Μίσθωσης
      url: https://www.aade.gr
      access: manual
      licence: Δημόσιο
    feasibility: hard
    effort: μεγάλη — δεν υπάρχει δομημένη πηγή ανά περιοχή
    expected_lift: υψηλό
    status: idea
    notes: >-
      ΚΡΙΣΙΜΟ: αυτή τη στιγμή η μηχανή προτείνει βραχυχρόνια μίσθωση χωρίς να
      ξέρει αν επιτρέπεται. Μέχρι να λυθεί, η στρατηγική φέρει προειδοποίηση.

  - id: SIG-012
    title: Ζώνες αντικειμενικών αξιών
    hypothesis: >-
      Οι τιμές ζώνης καθορίζουν φόρο μεταβίβασης και ΕΝΦΙΑ, άρα το πραγματικό
      κόστος κτήσης και κατοχής. Επιπλέον, μεγάλη απόκλιση εμπορικής από
      αντικειμενική είναι από μόνη της σήμα.
    category: ρυθμιστικό
    horizon: immediate
    affects: [costs, value_gap]
    source:
      name: Υπουργείο Οικονομικών — πίνακες αντικειμενικών αξιών
      url: https://www.minfin.gr
      access: manual (PDF/XLS)
      licence: Δημόσιο
    feasibility: probable
    effort: μέτρια — εφάπαξ φόρτωση ανά αναπροσαρμογή
    expected_lift: υψηλό
    status: idea
    notes: >-
      Θα αντικαθιστούσε το σταθερό `enfia_per_sqm_eur` του costs.py με
      πραγματικό αριθμό ανά ζώνη. Χαμηλό ρίσκο, άμεσο όφελος ακρίβειας.

  - id: SIG-013
    title: Δασικοί χάρτες και αιγιαλός
    hypothesis: >-
      Για γη, η μόνη ερώτηση που έχει σημασία πριν από κάθε άλλη είναι αν
      χτίζεται. Δασικός χαρακτηρισμός ή ζώνη αιγιαλού μηδενίζει την υπόθεση.
    category: ρυθμιστικό
    horizon: immediate
    affects: [feasibility, strategy_land_develop]
    source:
      name: Ελληνικό Κτηματολόγιο — θεατής δασικών χαρτών
      url: https://www.ktimanet.gr
      access: WMS/WFS
      licence: Δημόσιο
    feasibility: hard
    effort: μεγάλη — γεωχωρική διασταύρωση
    expected_lift: υψηλό για γη, μηδενικό για κτίσματα
    status: idea
    notes: >-
      Το 12.381 οικόπεδα κάτω από 50.000 € είναι το μεγαλύτερο τμήμα της αγοράς
      μας και αυτό για το οποίο ξέρουμε τα λιγότερα.

  # ------------------------------------------------------- μακροοικονομικό
  - id: SIG-014
    title: Δείκτης τιμών κατοικιών ΤτΕ ανά περιοχή
    hypothesis: >-
      Το `annual_drift_pct` είναι σήμερα σταθερά που μαντεύουμε. Η ΤτΕ δημοσιεύει
      πραγματικό δείκτη ανά γεωγραφική ζώνη, βασισμένο σε εκτιμήσεις τραπεζών.
    category: μακροοικονομικό
    horizon: 1-2y
    affects: [value_at_horizon, όλες οι στρατηγικές]
    source:
      name: Τράπεζα της Ελλάδος — δείκτες τιμών ακινήτων
      url: https://www.bankofgreece.gr
      access: XLS / statistics portal
      licence: Δημόσιο
    feasibility: probable
    effort: μικρή
    expected_lift: υψηλό
    status: research
    notes: >-
      Κάθε στρατηγική με ορίζοντα εξαρτάται από αυτόν τον αριθμό. Είναι η
      μεγαλύτερη μονή παραδοχή που κάνει η μηχανή.

  - id: SIG-015
    title: Πραγματικές τιμές συναλλαγών
    hypothesis: >-
      Όλη η μηχανή στηρίζεται σε ΖΗΤΟΥΜΕΝΕΣ τιμές με ένα κούρεμα 7% που
      μαντέψαμε. Πραγματικά συμβόλαια θα αντικαθιστούσαν την παραδοχή με μέτρηση.
    category: μακροοικονομικό
    horizon: immediate
    affects: [base_per_sqm, τα πάντα]
    source:
      name: Δικά μας κλεισμένα deals + δεδομένα συμβολαιογράφων/κτηματολογίου
      url: ""
      access: εσωτερικό / εμπορική συμφωνία
      licence: —
    feasibility: hard
    effort: μεγάλη
    expected_lift: πολύ υψηλό
    status: idea
    notes: >-
      Η πιο σημαντική εγγραφή του μητρώου. Κάθε deal που κλείνουμε πρέπει να
      καταγράφεται: ζητούμενο, τελικό, ημερομηνίες, κόστη. Μετά από 20 deals
      έχουμε δική μας βαθμονόμηση που κανείς ανταγωνιστής δεν έχει.

  # -------------------------------------------------------- μικρο-τοπικό
  - id: SIG-016
    title: Θόρυβος, θέα και προσανατολισμός
    hypothesis: >-
      Δύο πανομοιότυπα διαμερίσματα στον ίδιο δρόμο διαφέρουν 15% αν το ένα
      βλέπει σε ακάλυπτο και το άλλο σε λεωφόρο. Το ξέρει κάθε μεσίτης· η
      μηχανή μας δεν το βλέπει.
    category: μικρο-τοπικό
    horizon: immediate
    affects: [valuation_factors]
    source:
      name: OSM κατηγορίες δρόμων + υψομετρικά + φωτογραφίες αγγελίας
      url: https://overpass-api.de
      access: API
      licence: ODbL
    feasibility: probable
    effort: μέτρια
    expected_lift: μέτριο
    status: idea

  - id: SIG-017
    title: Ποιότητα γειτονιάς από σημεία ενδιαφέροντος
    hypothesis: >-
      Πυκνότητα καφέ, σχολείων, φαρμακείων και σούπερ μάρκετ σε ακτίνα 500 μ.
      προβλέπει και ενοίκιο και ρευστότητα καλύτερα από την ταχυδρομική ζώνη.
    category: μικρο-τοπικό
    horizon: immediate
    affects: [liquidity, rental_yield]
    source:
      name: OpenStreetMap Overpass
      url: https://overpass-api.de
      access: API
      licence: ODbL
    feasibility: probable
    effort: μέτρια — ένα αίτημα ανά κελί, cache-αρίσιμο
    expected_lift: μέτριο
    status: idea

  - id: SIG-018
    title: Ανάλυση φωτογραφιών αγγελίας
    hypothesis: >-
      Οι φωτογραφίες λένε την κατάσταση καλύτερα από το κείμενο. «Χρήζει
      ανακαίνισης» σημαίνει δέκα διαφορετικά πράγματα· μια φωτογραφία κουζίνας
      δεν σημαίνει.
    category: μικρο-τοπικό
    horizon: immediate
    affects: [valuation_factors, works_cost]
    source:
      name: Πεδίο image_gallery των αγγελιών
      url: ""
      access: εσωτερικό
      licence: εξαρτάται από την πύλη
    feasibility: probable
    effort: μεγάλη
    expected_lift: υψηλό
    status: idea
    notes: >-
      Σήμερα το `condition` βγαίνει από λέξεις-κλειδιά και είναι ο πιο βαρύς
      συντελεστής της αποτίμησης (-20% ως +24%). Είναι και ο πιο αδύναμα
      τεκμηριωμένος.

  # ------------------------------------------------------------ απορριφθέν
  - id: SIG-021
    title: Αξιοπιστία ζητούμενων τιμών — απόκλιση ζητούμενης από τελική
    hypothesis: >-
      Η μηχανή κατέτασσε με βάση την έκπτωση έναντι των ζητούμενων τιμών του
      χαρτοφυλακίου των πυλών. Αυτό είναι εύθραυστο και ενδέχεται να είναι ψέμα:
      ζητούμενη τιμή είναι γνώμη πωλητή, όχι γεγονός. Αν μετρήσουμε την
      πραγματική απόκλιση ζητούμενης–τελικής ανά περιοχή και τύπο, παύουμε να
      μαντεύουμε το κούρεμα και μπορούμε να βαθμονομήσουμε τη δοκιμή αντοχής
      με πραγματικά νούμερα αντί για 20%/15% που επιλέξαμε.
    category: μακροοικονομικό
    horizon: immediate
    affects: [certainty, return, όλες οι στρατηγικές]
    source:
      name: Δικά μας deals + ιστορικό σαρώσεων (τιμή στην ανάρτηση vs στην απόσυρση)
      url: ""
      access: εσωτερικό
      licence: δικό μας
    feasibility: probable
    effort: μικρή για το ιστορικό, μεγάλη για τα συμβόλαια
    expected_lift: πολύ υψηλό
    status: implemented
    implemented_by: MECH-017
    notes: >-
      Υλοποιημένο ως ΔΟΚΙΜΗ ΑΝΤΟΧΗΣ με υποθετικά ποσοστά, όχι ως μέτρηση. Η
      πλήρης εκδοχή απαιτεί το SIG-008 (ιστορικό σαρώσεων) και το SIG-015.
      Μέχρι τότε, η κατάταξη γίνεται στην απόδοση υπό πίεση και η ευθραυστότητα
      εμφανίζεται ως ξεχωριστός δείκτης αντί να κρύβεται.

  - id: SIG-022
    title: Ανεξαρτησία από τις πύλες — δεδομένα από οπουδήποτε
    hypothesis: >-
      Οι πύλες είναι το εύθραυστο κομμάτι: μία είναι πίσω από σύστημα ανίχνευσης
      bot, άλλη απαγορεύει ονομαστικά τους πράκτορες της Claude, και και οι δύο
      μπορούν να αλλάξουν γνώμη οποιαδήποτε στιγμή. Τίποτα κατάντη — αποτίμηση,
      32 πλάνα, έξι δείκτες, δοκιμή αντοχής — δεν εξαρτάται από αυτές. Αν η
      είσοδος γίνει αρχείο, η μηχανή δουλεύει με ό,τι δεδομένα υπάρχουν: δικά
      μας, ενός μεσίτη, μιας συνδρομητικής ροής, ή ενός φύλλου Excel.
    category: προσφορά
    horizon: immediate
    affects: [candidates, όλες οι αναλύσεις]
    source:
      name: Οποιοδήποτε αρχείο CSV/TSV
      url: ""
      access: τοπικό αρχείο
      licence: δικό μας
    feasibility: proven
    effort: μικρή
    expected_lift: υψηλό
    status: implemented
    implemented_by: MECH-203
    notes: >-
      Είναι και η απάντηση στο ζήτημα πρόσβασης: όποια πύλη επιτρέπει εξαγωγή, ή
      όποιος συνεργάτης στέλνει λίστα, μπαίνει κατευθείαν στη μηχανή χωρίς καμία
      σάρωση.

  - id: SIG-023
    title: Οι Όροι Χρήσης υπερισχύουν του robots.txt
    hypothesis: >-
      Το robots.txt είναι η πολιτική μιας πύλης για crawlers· οι Όροι Χρήσης
      είναι η σύμβαση. Όταν διαφωνούν, υπερισχύει η σύμβαση. Το Spitogatos
      επιτρέπει τις σελίδες αναζήτησης στο robots.txt και δεν μας ονομάζει —
      αλλά το άρθρο 2 των Όρων του επιτρέπει ηλεκτρονική αποθήκευση «for
      personal use, but by no means for commercial use». Αν κρίναμε μόνο από
      το robots.txt, θα τρέχαμε κάτι που η σύμβαση απαγορεύει.
    category: ρυθμιστικό
    horizon: immediate
    affects: [sources, feasibility]
    source:
      name: Όροι Χρήσης κάθε πύλης
      url: https://www.spitogatos.gr/en/page/legalTerms
      access: manual — απαιτεί ανάγνωση από άνθρωπο
      licence: —
    feasibility: proven
    effort: μικρή ανά πηγή, αλλά μη αυτοματοποιήσιμη
    expected_lift: κρίσιμο, όχι «όφελος»
    status: implemented
    implemented_by: MECH-206
    notes: >-
      Η σελίδα των Όρων του Spitogatos είναι η ίδια πίσω από το σύστημα
      ανίχνευσης bot — δεν μπόρεσε να διαβαστεί αυτόματα και χρειάστηκε άνθρωπος
      να την ανοίξει. Αυτό είναι κανόνας, όχι εξαίρεση: πριν προστεθεί
      οποιαδήποτε νέα πηγή, κάποιος πρέπει να διαβάσει τους Όρους της.

  - id: SIG-024
    title: Το «πού» απαντιέται χωρίς καμία τιμή ακινήτου
    hypothesis: >-
      Δύο ερωτήματα κρύβονται σε κάθε αναζήτηση ευκαιρίας: πού να ψάξεις και τι
      να αγοράσεις. Το δεύτερο χρειάζεται αγγελίες. Το πρώτο δεν χρειάζεται:
      απαντιέται από τη ζήτηση που πληρώνει με τη νύχτα και από το πού ξοδεύει
      το δημόσιο. Όταν οι δύο κατατάξεις συμφωνούν σε έναν δήμο, εκεί αξίζει να
      ξεκινήσει η αναζήτηση. Πρακτικά έχει σημασία επειδή οι πύλες αγγελιών
      μπορεί να είναι απρόσιτες από ένα συγκεκριμένο δίκτυο, ενώ τα ανοιχτά
      δεδομένα είναι πάντα διαθέσιμα.
    category: ζήτηση
    horizon: immediate
    affects: [sourcing, strategy_rent_short, liquidity]
    source:
      name: Eurostat tour_occ_nin2 + Διαύγεια
      url: https://diavgeia.gov.gr/api
      access: API
      licence: Ανοικτά δεδομένα
    feasibility: proven
    effort: μικρή — τα δύο σήματα υπάρχουν ήδη
    expected_lift: μεσαίο
    status: implemented
    implemented_by: MECH-104
    notes: >-
      Ο συνδυασμός είναι μέσος όρος δύο κατατάξεων και δηλώνεται ως τέτοιος στη
      σελίδα. Δεν είναι πρόβλεψη απόδοσης και δεν αντικαθιστά την ανάλυση του
      ακινήτου: λέει πού να κοιτάξεις, όχι τι να αγοράσεις.

