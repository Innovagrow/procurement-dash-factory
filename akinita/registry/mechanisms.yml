  - id: MECH-202
    title: Φράγμα robots.txt με προτεραιότητα Allow
    implements: SIG-015
    module: akinita/http.py
    entrypoint: RobotsGate.allows
    produces: [access_decision]
    feeds_score: "—"
    weight: 0.0
    validation: >-
      Μεγαλύτερος κανόνας Allow υπερισχύει μικρότερου Disallow· ομάδα που
      ονομάζει εμάς (ClaudeBot, Claude-User, Claude-Web κ.λπ.) υπερισχύει της
      ομάδας «*» και προς τις δύο κατευθύνσεις. Χωρίς αυτό, ο έλεγχος θα
      προσπερνούσε το `User-agent: ClaudeBot / Disallow: /` του remax.gr και τους
      αντίστοιχους κανόνες του xe.gr. Επιπλέον, ΟΛΕΣ οι ομάδες που αφορούν τον
      ίδιο πράκτορα συγχωνεύονται: το spitogatos.gr χωρίζει τους κανόνες του «*»
      σε τέσσερα μπλοκ και, κρατώντας μόνο το πρώτο, η απαγορευμένη διαδρομή
      `map-search` εμφανιζόταν ως επιτρεπτή.
    known_limits: >-
      Δεν καλύπτει Crawl-delay ούτε Content-Signal. Η ταυτότητα του πράκτορα
      θεωρείται δεδομένη — δεν επιχειρείται καμία παράκαμψη μέσω άλλου
      User-Agent.
    status: active
    since: 2026-08-22
